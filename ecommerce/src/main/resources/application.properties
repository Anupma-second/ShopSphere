spring.application.name=ecommerce


# Render / most hosts give the port in $PORT. Locally it stays 8080.
server.port=${PORT:8080}
# Behind the host's proxy: take the real visitor IP (used by the login
# rate limiter) and https scheme from X-Forwarded-* headers
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Loads KEY=value lines from a local ".env" file in the working directory
# (git-ignored). Real environment variables override it. See .env.example
spring.config.import=optional:file:.env[.properties]

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- JWT (secret must be at least 32 characters) ----
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---- Razorpay ----
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
# Webhook secret = the secret you type when creating the webhook in the Razorpay dashboard
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}


# ---- App ----
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
app.mail.from=${MAIL_FROM:no-reply@shopsphere.local}
app.order.pending-timeout-minutes=${ORDER_PENDING_TIMEOUT_MINUTES:30}
app.refund.max-attempts=${REFUND_MAX_ATTEMPTS:5}

# ---- Login rate limiting (failed attempts inside the window) ----
app.login.max-failures-per-account=${LOGIN_MAX_FAILURES_PER_ACCOUNT:5}
app.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:20}
app.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}

# ---- API docs: http://localhost:8080/swagger-ui.html ----
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method


# ---- Mail (optional) ----
# Leave spring.mail.host unset and emails are printed to the console.
# To send real mail add these lines to .env:
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=you@gmail.com
#   spring.mail.password=your-app-password
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
